# Celar threshold KMS.
#
# Upstream: our fork of zama-ai/kms, pinned by rev (portable, reproducible;
# mirrors how celard pins cosmos/evm). Pin history:
#   zama tag v0.13.22 (tfhe =1.6.1)
#   → zama main@c6b0fdd3 on 2026-08-16: upstream crossed to tfhe =1.7.0,
#     aligning the KMS with the compute backend (`fhe/backend-adapter/zama`)
#     so threshold decryption consumes coprocessor ciphertexts with no
#     cross-version serialization bridge.
#   → celar-network/kms@8015482e on 2026-08-28: one commit on top of
#     c6b0fdd3 splitting the statistical flooding parameter by mask path —
#     STATSEC stays 40 (the PRSS path's ceiling at PRSS_SIZE_MAX), new
#     STATSEC_TUNIFORM = 50 governs the large-session/TUniform sizing sites,
#     both ceilings compile-time asserted. The vendor accepts no external
#     PRs (their CONTRIBUTING.md), so this fork is the standing carrier;
#     the change is proposed upstream as zama-ai/kms issues #807/#808.
#   → celar-network/kms@d5e3075e on 2026-09-05: a second commit on the same
#     carrier branch (celar/statsec-tuniform-50), splitting the sharing
#     DEGREE from the error-correction TOLERANCE in the two-sets robust
#     opens — reconstruction of a degree-d sharing among n parties tolerates
#     the Reed-Solomon bound ⌊(n−d−1)/2⌋, not the degree itself, so an
#     upward reshare to a high degree (a degree-78 key on a 100-seat
#     committee) reconstructs instead of aborting. Inert for standard
#     configs. Consumed by the upward-reshare wiring.
#   → celar-network/kms@b79e997d on 2026-09-05: a third carrier commit —
#     tightens LOG_B_SWITCH_SQUASH 70→68 (the DERIVED switch-and-squash bound,
#     ≈2^67.9, vs the loose 70 ceiling) and raises STATSEC_TUNIFORM 50→52. The
#     freed margin buys two bits of statistical security, so the per-epoch
#     decryption budget Q_max rises 2^10→2^12 (see budget.rs). Both compile-time
#     margin asserts still hold at the new pair.
#     ⚠️ Any future re-pin must re-apply ALL THREE commits (STATSEC_TUNIFORM,
#     the degree/tolerance split, and the derived-bound/λ=52 tightening) — the
#     carrier branch celar/statsec-tuniform-50 holds them in sequence.
# NOTE: STATSEC_TUNIFORM = 50 makes the 50-bit flooding parameter AVAILABLE;
# it is not IN FORCE until the decrypt path runs the large-session
# noiseflood route. budget.rs enforces that distinction and refuses until then.
# The threshold protocol implementation lives in the `threshold-execution`
# crate (the docs' `core/threshold` path is stale — see build-state note).
[package]
name = "celar-kms"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "celar-dkg"
path = "src/bin/celar_dkg.rs"

[dependencies]
threshold-execution = { git = "https://github.com/celar-network/kms.git", rev = "b79e997daf39f2b8b05575093a8e76e706526b84", features = ["testing"] }
threshold-networking = { git = "https://github.com/celar-network/kms.git", rev = "b79e997daf39f2b8b05575093a8e76e706526b84" }
threshold-types = { git = "https://github.com/celar-network/kms.git", rev = "b79e997daf39f2b8b05575093a8e76e706526b84" }
# NOTE (0.13.22 → main): threshold-algebra dropped its [features] section
# entirely at this rev — extension degrees are now unconditional, so the old
# `extension_degree_4` feature (and default-features = false) must go.
algebra = { package = "threshold-algebra", git = "https://github.com/celar-network/kms.git", rev = "b79e997daf39f2b8b05575093a8e76e706526b84" }

# Must match the kms workspace pins exactly — these types cross the API
# boundary (tfhe::Tag; tonic/rustls types into GrpcNetworkingManager).
# Matched against main@c6b0fdd3.
tfhe = { version = "=1.7.0", features = ["zk-pok"] }
tonic = "=0.14.6"
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["aws_lc_rs"] }
x509-parser = { version = "=0.18.1", features = ["verify-aws"] }
aes-prng = "=0.2.1"
# Same version threshold-algebra and aes-prng resolve (0.8.6), so AesRng
# satisfies the `Rng + CryptoRng` bound on ShamirSharings::share — a different
# rand major would be a second, incompatible trait set. Used by mask_supply.
rand = "=0.8.6"
# Ed25519 operational signing keys: each roster seat registers a signing
# pubkey and signs ceremony/reshare transcript digests, so an archived epoch
# carries reconstruction-quorum-many seat endorsements (the authorship a bare
# hash chain lacks). 2.x uses rand_core 0.6, matching rand 0.8.6's OsRng.
ed25519-dalek = { version = "2", features = ["rand_core"] }

anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bincode = "1.3"
# ICS23 path: cosmos/evm eth_getProof returns ics23 (IAVL + multistore)
# proofs, not MPT nodes — verified against the Tendermint AppHash.
ics23 = "0.12"
prost = "0.13"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rlp = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
# FHE/MPC in debug mode is unusable (~100x); always build/run --release.
opt-level = 3

# Upstream zama-ai/kms builds rcgen (and friends) from Zama forks via
# [patch.crates-io] in *their* workspace root. Cargo patches don't propagate
# through git dependencies, so we must mirror them here. Without the rcgen
# patch, crates.io rcgen + x509-parser fails to compile (E0599:
# verify_signature not found — CSR verify not gated for verify-aws).
# Mirrored from main@c6b0fdd3 (attestation-doc-validation patch was dropped
# upstream between v0.13.22 and main — dropped here to match).
[patch.crates-io]
rcgen = { git = "https://github.com/zama-ai/rcgen.git" }
rustls = { git = "https://github.com/zama-ai/rustls.git", branch = "rel-0.23" }
rustls-webpki = { git = "https://github.com/zama-ai/webpki.git", branch = "rel-0.103" }
