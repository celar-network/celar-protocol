# Celar threshold KMS — Track B (B1: DKG, genesis/permissioned mode first).
#
# Upstream: zama-ai/kms pinned at tag v0.13.22 (git dep — portable, no local
# clone required; mirrors how celard pins cosmos/evm). The threshold protocol
# implementation lives in the `threshold-execution` crate there (the docs'
# `core/threshold` path is stale — restructure reported in the build-state note).
#
# NOTE (version skew, flagged): this workspace pins tfhe =1.6.1 because the kms
# stack does; Track A's backend adapter (`fhe/backend-adapter/zama`) is on
# tfhe 1.7.0. Separate build trees, so no conflict today — but ciphertext-format
# compatibility between the coprocessor and the KMS must be reconciled before
# B2 (threshold decryption of Track A ciphertexts).
[package]
name = "celar-kms"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "celar-dkg"
path = "src/bin/celar_dkg.rs"

[dependencies]
threshold-execution = { git = "https://github.com/zama-ai/kms.git", tag = "v0.13.22", features = ["testing"] }
threshold-networking = { git = "https://github.com/zama-ai/kms.git", tag = "v0.13.22" }
threshold-types = { git = "https://github.com/zama-ai/kms.git", tag = "v0.13.22" }
algebra = { package = "threshold-algebra", git = "https://github.com/zama-ai/kms.git", tag = "v0.13.22", default-features = false, features = ["extension_degree_4"] }

# Must match the kms workspace pins exactly — these types cross the API
# boundary (tfhe::Tag; tonic/rustls types into GrpcNetworkingManager).
tfhe = "=1.6.1"
tonic = "=0.14.5"
tokio-rustls = { version = "=0.26.2", default-features = false, features = ["aws_lc_rs"] }
x509-parser = { version = "=0.18.0", features = ["verify-aws"] }
aes-prng = "=0.2.1"

anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bincode = "1.3"
# G10 ICS23 path: cosmos/evm eth_getProof returns ics23 (IAVL + multistore)
# proofs, not MPT nodes — verified against the Tendermint AppHash.
ics23 = "0.12"
prost = "0.13"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rlp = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
# FHE/MPC in debug mode is unusable (~100x); always build/run --release.
opt-level = 3

# Upstream zama-ai/kms builds rcgen (and friends) from Zama forks via
# [patch.crates-io] in *their* workspace root. Cargo patches don't propagate
# through git dependencies, so we must mirror them here. Without the rcgen
# patch, crates.io rcgen 0.14.7 + x509-parser 0.18.0 fails to compile
# (E0599: verify_signature not found — CSR verify not gated for verify-aws).
[patch.crates-io]
rcgen = { git = "https://github.com/zama-ai/rcgen.git" }
rustls = { git = "https://github.com/zama-ai/rustls.git", branch = "rel-0.23" }
rustls-webpki = { git = "https://github.com/zama-ai/webpki.git", branch = "rel-0.103" }
attestation-doc-validation = { git = "https://github.com/mkmks/attestation-doc-validation.git", branch = "timestamps" }
