# Celar FHE backend — Zama TFHE-rs implementation of the frozen ABI (ABI.md).
#
# Build notes:
#   CPU determinism runs (the fraud-game ground truth) must be built WITHOUT
#   the gpu feature and on a pinned toolchain. GPU throughput runs add the
#   "gpu" feature and build on the accelerator node.
[package]
name = "celar_zama"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "celar_zama"
# cdylib for the Python module, rlib so the Rust test suite still links
crate-type = ["cdylib", "rlib"]

[dependencies]
bincode = "1.3"
pyo3 = { version = "0.29.2", features = ["extension-module"], optional = true }
sha2 = "0.10"
tfhe = { version = "1.7.0", features = ["integer"] }

# The Python binding is optional: enabling pyo3's extension-module tells the
# linker the interpreter will supply Python symbols, which is right for the
# shared library but breaks standalone test binaries. maturin turns this on.
[features]
python = ["pyo3"]
