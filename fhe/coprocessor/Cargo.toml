# Celar coprocessor — the op-stream consumer.
#
# The backend library (celar_zama) can compute; this crate is what makes it a
# participant: it ingests the stream the chain emits, executes each op against
# the pinned backend, and attests to the result.
#
# Deliberately not a dependency of the backend, and the backend is not yet a
# dependency of this: the decoder needs neither TFHE nor a network, and keeping
# the first unit dependency-free keeps its test loop in milliseconds.
[package]
name = "celar_coprocessor"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
celar_zama = { path = "../backend-adapter/zama" }
sha3 = "0.10"
# The repository's first secp256k1. Signing is production behaviour, not a
# test concern, so this is a real dependency rather than a dev one.
#
# Pure Rust over bindings to the C library deliberately: this crate has no C
# toolchain requirement and gains none here. The cost is that low-s
# normalisation on this side and the verifier's low-s acceptance rule are two
# implementations of one convention - which is exactly what the shared vector
# exists to catch, so the bet is checked rather than taken.
k256 = { version = "0.13", features = ["ecdsa"] }
# Promoted from a dev dependency 2026-09-25, when the live stream source landed:
# reading the chain's own logs means parsing an RPC response, and hand-rolled
# extraction from JSON is the kind of thing that works on every response anyone
# thought to try. No HTTP client here on purpose - the transport is a trait, so
# this crate parses and does not dial.
serde_json = "1"

# HTTP for the runnable binary only, behind a feature, so the library keeps the
# property that made its test loop milliseconds: no network, no TLS stack, no
# runtime. default-features off leaves plain HTTP - the devnet is local and a
# TLS implementation we do not use is advisory surface we would carry for
# nothing.
ureq = { version = "2", optional = true, default-features = false }
# The binary arms the backend's server key, which is thread-local state
# inside the library. Optional for the same reason ureq is: the library and
# its tests do not need it at build time, and the default build should stay
# the small one.
tfhe = { version = "1.7.0", features = ["integer"], optional = true }

[features]
# The binary. Off by default: `cargo test` builds neither the transport nor its
# dependencies.
cli = ["dep:ureq", "dep:tfhe"]

[[bin]]
name = "celar-copro"
path = "src/bin/celar_copro.rs"
required-features = ["cli"]

[dev-dependencies]
tfhe = { version = "1.7.0", features = ["integer"] }
hex = "0.4"
