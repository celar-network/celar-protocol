syntax = "proto3";
package celar.fraudevidence.v1;

import "gogoproto/gogo.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "celar/fraudevidence/v1/attestation.proto";

option go_package = "github.com/cosmos/evm/evmd/fraudevidence/types";

// Msg is how evidence and attestations reach the chain.
//
// A message service rather than a precompile: this is consensus state written
// for an off-chain verifier to read, not an operation on ciphertext. The same
// reasoning put the commitment archive in a module, and answering the question
// once for both message kinds is why they share this service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // SubmitAttestation records a coprocessor's claim about one executed
  // operation.
  rpc SubmitAttestation(MsgSubmitAttestation) returns (MsgSubmitAttestationResponse);
}

// MsgSubmitAttestation carries an attestation to be recorded.
//
// The submitter is the transaction signer and is NOT assumed to be the
// attesting coprocessor: the attestation carries its own identity and its own
// signature over the pinned preimage, so anyone may relay one. That is
// deliberate - a coprocessor that cannot reach the chain must not be unable to
// have its work recorded, and the signature is what authenticates the claim
// rather than the sender.
message MsgSubmitAttestation {
  option (cosmos.msg.v1.signer) = "submitter";

  // Fee payer and relayer. Carries no authority over the attestation's
  // contents.
  string submitter = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  Attestation attestation = 2 [(gogoproto.nullable) = false];
}

message MsgSubmitAttestationResponse {
  // Whether an identical attestation was already recorded for this position.
  //
  // Reported rather than silent: at-least-once delivery and permissionless
  // relaying make duplicates ordinary, and a relayer that cannot tell "stored"
  // from "already there" will either retry forever or assume failure.
  bool already_recorded = 1;
}
